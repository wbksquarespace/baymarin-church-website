name: Check BayMarin Form Service
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/check-form-service.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend syntax
        run: node --check functions/index.js
      - name: Install dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Confirm backend exports
        working-directory: functions
        run: |
          node -e "const m=require('./index.js'); if(typeof m.submitForm!=='function'||typeof m.sendVisitReminders!=='function') process.exit(1); console.log('Backend exports verified.')"
