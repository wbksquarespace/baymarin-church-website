name: Deploy BayMarin Contact Forms API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baymarin-forms-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy contact form and confirmation email API
    runs-on: ubuntu-latest
    environment: forms-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloud Functions source
        run: node --check functions/index.js
      - name: Install dependencies
        run: npm --prefix functions ci
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAY_MARIN_CHURCH_WEBSITE }}'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy form endpoint
        run: firebase deploy --only functions:submitForm --project bay-marin-church-website --non-interactive
