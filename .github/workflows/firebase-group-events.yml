name: Deploy BayMarin Group Events API

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-group-events.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-group-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAY_MARIN_CHURCH_WEBSITE }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm --prefix functions install --omit=dev --no-audit --no-fund
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Validate functions JavaScript
        run: node --check functions/index.js
      - name: Deploy public events endpoint only
        run: firebase deploy --only functions:listGroupEvents --project bay-marin-church-website --non-interactive
