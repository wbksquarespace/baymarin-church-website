name: Import BayMarin Sermon Archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import_baymarin_messages.py
      - .github/workflows/import-sermon-archive.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python scripts/import_baymarin_messages.py
      - name: Publish catalog to GitHub
        run: |
          git config user.name "baymarin-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BayMarin_Firebase_Master_V36/public/assets/baymarin-messages-catalog.json
          if ! git diff --staged --quiet; then
            git commit -m "Import and index BayMarin audio archive"
            git push
          fi
