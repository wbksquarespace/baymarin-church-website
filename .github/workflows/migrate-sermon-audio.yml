name: Migrate BayMarin Historic Audio to Firebase
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baymarin-archive-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: sermon-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAY_MARIN_CHURCH_WEBSITE }}'
      - run: python -m pip install google-cloud-storage google-cloud-firestore requests
      - name: Copy original audio to Firebase Storage and index in Firestore
        run: python scripts/migrate_baymarin_audio.py
      - name: Preserve completed migration metadata
        if: always()
        run: |
          git config user.name "baymarin-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BayMarin_Firebase_Master_V36/public/assets/baymarin-messages-catalog.json
          if ! git diff --staged --quiet; then
            git commit -m "Keep migrated BayMarin archive links"
            git push
          fi
